server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/x-javascript application/xml+rss 
               application/json application/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the backend container (enables single-host deployment)
    location /api/alerts/stream {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx defaults these to 60s, which silently capped every API call.
        # A data import on the production Pi can legitimately outlast that,
        # and when it did, nginx returned its own HTML 504 — which the client
        # cannot turn into a useful message, so the user saw a generic
        # "unexpected error" instead of anything the backend had to say.
        # Raised well past the slowest real request; the backend's own
        # transaction ceiling remains the meaningful limit.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Uploads travel this path too, so allow an OFB export through. The
        # route enforces the real 5MB cap and returns a proper message; this
        # only stops nginx rejecting the body before it ever gets there.
        client_max_body_size 16m;
    }

    # Proxy backend health check (optional convenience)
    location = /health {
        proxy_pass http://backend:3001/health;
        proxy_set_header Host $host;
    }

    # React Router handling
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
