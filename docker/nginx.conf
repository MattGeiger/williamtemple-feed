server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/x-javascript application/xml+rss 
               application/json application/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the backend container (enables single-host deployment)
    location /api/alerts/stream {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx defaults these to 60s, which silently capped every API call.
        # A data import on the production Pi can legitimately outlast that,
        # and when it did, nginx returned its own HTML 504 — which the client
        # cannot turn into a useful message, so the user saw a generic
        # "unexpected error" instead of anything the backend had to say.
        # Raised well past the slowest real request; the backend's own
        # transaction ceiling remains the meaningful limit.
        #
        # NOTE: this 300s is NOT the effective production ceiling. Cloudflare's
        # edge returns 524 at ~100s regardless of origin configuration, and
        # production is served through Cloudflare Tunnel. Any request that must
        # survive longer than ~100s has to become a background job the client
        # polls — it cannot be fixed here. See ISSUES.md #67.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # MUST NOT be lower than MAX_STAGED_DATA_IMPORT_BYTES in
        # packages/backend/src/services/data-import/staging.ts (64 MB), which is
        # the cap that returns a real, actionable message to the user. This
        # directive only stops nginx rejecting the body before the route ever
        # sees it — a 413 here is issued mid-upload, so the dialog gets no
        # server message and simply appears to stall.
        #
        # These two numbers drifted once and cost a production import: this was
        # 16m (scoped to the old 5MB OFB path) while unified Add Data shipped a
        # 64MB ceiling sized against a 16,940,175-byte Link2Feed export — which
        # already exceeded 16 MiB the day that ceiling was chosen. Change both
        # together or neither. See ISSUES.md #68.
        client_max_body_size 64m;
    }

    # Restoring a backup uploads the whole artifact, twice: once to validate
    # it and once to apply it. Both are far larger than anything else FEED
    # accepts, so they get their own ceiling rather than raising the general
    # one to suit the largest request in the app.
    #
    # MUST match MAX_ARTIFACT_BYTES in
    # packages/backend/src/routes/admin/restore.ts (256 MB), which is the cap
    # that returns a real message. This is the second time these numbers have
    # drifted: the /api/ block below records the first (ISSUES.md #68, a 16m
    # nginx limit against a 64MB application ceiling, which cost a production
    # import). This one was worse — 64m here against restore's 256MB — because
    # it made disaster recovery impossible rather than merely awkward: a real
    # 152 MB production artifact was rejected by nginx before the backend saw
    # a byte of it, and nothing in development could reveal that, since the
    # development frontend talks to the backend directly with no proxy in
    # between. Found by rehearsing a recovery in Docker (ISSUES.md #83).
    location /api/admin/restore {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 256m;

        # Building and swapping the database is not a quick request, and the
        # upload itself is minutes on a Pi.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Proxy backend health check (optional convenience)
    location = /health {
        proxy_pass http://backend:3001/health;
        proxy_set_header Host $host;
    }

    # React Router handling
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
